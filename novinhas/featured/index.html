<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Home preview queue</title>
<style>body{margin:0;background:#0f0f0f;color:#eee;font:14px/1.5 system-ui,sans-serif;padding:24px}h1{margin:0 0 4px;font-size:20px}a{color:#e8b84a}.s{color:#aaa;margin:0 0 18px}.r{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:6px 0;border:1px solid #333;border-radius:12px;background:#171717}.r.cur{border-color:#ffd76a;background:#201a08}.r img{width:90px;height:56px;object-fit:cover;border-radius:8px;background:#000}.r div{flex:1;min-width:0}.r small{color:#999;display:block}button{border:0;border-radius:8px;padding:7px 12px;font:700 12px system-ui;cursor:pointer;background:#2a2a2a;color:#fff}button.g{background:#f7c83a;color:#2a1a00}h2{margin:22px 0 6px;font-size:13px;letter-spacing:.12em;color:#e8b84a;text-transform:uppercase}</style></head><body>
<h1>Home preview queue</h1><p class="s">Each preview stays at least 1 hour. When the queue is empty, one of the saved ones is picked at random. Add videos with the "Add to home preview queue" button on any video page (only you see it). <a href="/">Home</a></p>
<div id="v">Loading...</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function post(b){return fetch('/api/novinhas/featured',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function row(it,cur,d){var left=cur&&it.id===cur.id?Math.max(0,d.hold-(d.now-cur.since)):0;
 return '<div class="r'+(cur&&it.id===cur.id?' cur':'')+'"><img loading="lazy" src="/api/novinhas/file?k='+esc(it.slug)+'/previews/poster-'+pad(it.vid)+'.webp" alt=""><div><b>'+esc(it.name)+'</b> &middot; '+esc(it.title)+'<small>shown '+it.shown+' times'+(left?' &middot; live now, '+Math.ceil(left/60)+' min left':'')+'</small></div>'+
 (cur&&it.id===cur.id?'':'<button class="g" data-a="now" data-i="'+it.id+'">Show now</button>')+(it.queued?'':'<button data-a="requeue" data-i="'+it.id+'">Queue again</button>')+'<button data-a="remove" data-i="'+it.id+'">Delete</button></div>'}
function load(){fetch('/api/novinhas/featured?list=1',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){var v=document.getElementById('v');
 if(!d.ok){v.textContent='Owner only. Sign in with your owner account.';return}
 var c=d.current,items=d.items,q=items.filter(function(i){return i.queued&&!(c&&i.id===c.id)}),rest=items.filter(function(i){return !i.queued&&!(c&&i.id===c.id)}),cu=items.filter(function(i){return c&&i.id===c.id});
 v.innerHTML='<h2>Live now</h2>'+(cu.map(function(i){return row(i,c,d)}).join('')||'<p class="s">Nothing yet.</p>')+(cu.length?'<p><button data-a="next">Skip to next</button></p>':'')+'<h2>Queue ('+q.length+')</h2>'+(q.map(function(i){return row(i,c,d)}).join('')||'<p class="s">Empty: random rotation from the saved ones.</p>')+'<h2>Saved, rotating at random ('+rest.length+')</h2>'+rest.map(function(i){return row(i,c,d)}).join('')})}
document.getElementById('v').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;post({action:b.dataset.a,item:b.dataset.i}).then(load)});load();
</script></body></html>
