<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Kelina Kessia · Novinhas</title><style>body{margin:0;background:#0f0f0f;color:#fff;font:16px Arial,sans-serif}header{position:sticky;top:0;background:#0f0f0f;padding:18px 5%;border-bottom:1px solid #333;z-index:2;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}main{max-width:1400px;margin:auto;padding:30px 5%}.banner{padding:50px 30px;background:linear-gradient(110deg,#321523,#151515);border-radius:16px}.banner h1{font-size:clamp(34px,6vw,70px);margin:0}.banner p{color:#ccc}.search{width:100%;max-width:530px;margin:32px 0;padding:13px 18px;border:1px solid #555;background:#222;color:#fff;border-radius:24px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}.card{display:block}.thumb{height:230px;background:#191919;border-radius:12px;display:grid;place-items:center;overflow:hidden}.thumb img{height:100%;width:100%;object-fit:contain}.card strong{display:block;margin-top:12px;line-height:1.35}.card small{display:block;color:#aaa;margin-top:5px}#count{color:#aaa}</style></head><body><header><a href="/novinhas/">☰ Novinhas</a><a href="/">Twerkhub</a><a href="/account">My account</a></header><main><div class="banner"><h1>Kelina Kessia</h1><p>Video channel · complete collection</p></div><input class="search" id="search" type="search" placeholder="Search Kelina's videos" aria-label="Search Kelina's videos"><p id="count">Loading videos…</p><div class="grid" id="videos"></div></main><script>fetch('/novinhas/watch/videos.json').then(r=>r.json()).then(data=>{const all=data.videos||[],grid=document.getElementById('videos'),search=document.getElementById('search'),count=document.getElementById('count');function render(){const found=all.filter(v=>v.title.toLowerCase().includes(search.value.trim().toLowerCase()));count.textContent=found.length+' videos';grid.replaceChildren(...found.map(v=>{const a=document.createElement('a');a.className='card';a.href='/novinhas/watch/#video-'+String(v.id).padStart(2,'0');const thumb=document.createElement('div');thumb.className='thumb';const img=document.createElement('img');img.src=v.poster;img.alt='';img.loading='lazy';thumb.append(img);const title=document.createElement('strong');title.textContent=v.title;const meta=document.createElement('small');meta.textContent='Kelina Kessia · '+v.width+' × '+v.height;a.append(thumb,title,meta);return a}))}search.addEventListener('input',render);render()}).catch(()=>document.getElementById('count').textContent='Videos unavailable right now.');</script><script src="/assets/novinhas-nav.js?v=20261114d"></script></body></html>
