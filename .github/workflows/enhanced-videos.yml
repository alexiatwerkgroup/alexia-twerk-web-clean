name: enhanced-videos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enhanced-videos.yml', 'tools/enhance_worker.py', 'upscaler/**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: enhanced-videos
  cancel-in-progress: false
permissions:
  contents: read
  packages: read
jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install boto3 requests
      - name: Process one queued Enhanced video
        run: python3 tools/enhance_worker.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SALAD_UPSCALER_URL: https://tomato-sweetcorn-tcs3yk4wy4hez8ak.salad.cloud
          SALAD_UPSCALER_TOKEN: ${{ secrets.SALAD_UPSCALER_TOKEN }}
