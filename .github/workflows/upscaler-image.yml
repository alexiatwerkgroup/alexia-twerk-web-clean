name: upscaler-image
on:
  push:
    branches: [upscaler-image]
    paths: ['upscaler/**', '.github/workflows/upscaler-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: upscaler
          push: true
          tags: ghcr.io/alexiatwerkgroup/twerkhub-upscaler:latest
          labels: org.opencontainers.image.source=https://github.com/alexiatwerkgroup/alexia-twerk-web-clean
