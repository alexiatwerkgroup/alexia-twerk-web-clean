name: mini-clips
# Corta los miniclips que se marcan con REC y los sube a R2 (sin depender de ninguna PC).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mini-clips.yml', 'tools/mini_worker.py', 'tools/preview_worker.py', 'tools/locked_teaser_worker.py']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: mini-clips
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install boto3
      - run: which ffmpeg >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python3 tools/mini_worker.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - if: always()
        run: python3 tools/preview_worker.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - if: always()
        continue-on-error: true
        run: python3 tools/locked_teaser_worker.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
