name: locked-video-teasers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/locked-video-teasers.yml', 'tools/locked_teaser_worker.py']
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: locked-video-teasers
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install boto3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 tools/locked_teaser_worker.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
