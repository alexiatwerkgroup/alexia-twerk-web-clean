name: card-clips
on:
  workflow_dispatch:
    inputs:
      slug: { description: 'canal (slug) o ALL', required: true, default: 'ALL' }
      dry: { description: 'dry = solo contar', required: false, default: '' }
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install boto3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 tools/card_clips.py "${{ inputs.slug }}" ${{ inputs.dry }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
