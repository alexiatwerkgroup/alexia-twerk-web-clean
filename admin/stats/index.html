<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Estadísticas · Twerkhub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap">
<style>
:root{--bg:#07070b;--card:#0e0e14;--line:#2a2a34;--fg:#f4f4f8;--mut:#9a9aaa;--g1:#fff1a8;--g2:#e8b84a;--g3:#9a6410;--ok:#5df08a;--pk:#ff3d7f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Manrope,system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:1200px;margin:auto}h1{font:800 26px Manrope;margin:0}h2{font:800 12px Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);margin:0 0 12px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.top .sel button{background:#14141c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:800 12px Manrope;cursor:pointer}.top .sel button.on{background:linear-gradient(180deg,var(--g1),var(--g2));color:#1a1204;border-color:var(--g1)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{padding:16px;border-radius:16px;background:linear-gradient(180deg,#1b1608,#0b0905);border:1.5px solid #6a5420;box-shadow:5px 6px 0 #3a2c0a,0 0 22px #e8b84a22;transform:perspective(600px) rotateX(5deg)}
.k b{display:block;font:900 34px/1.1 "Arial Black",system-ui;color:var(--g1);text-shadow:0 2px 0 #7a4c0a,0 0 14px #e8b84a77}.k span{font:800 11px Manrope;letter-spacing:.1em;text-transform:uppercase;color:#c9b27a}.k i{display:block;font:500 12px Manrope;color:var(--mut);font-style:normal;margin-top:2px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}@media(max-width:900px){.s8,.s6,.s4{grid-column:span 12}}
.bar{display:grid;grid-template-columns:150px 1fr 76px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .t{height:14px;border-radius:99px;background:#1a1a22;overflow:hidden}.bar .t u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g3),var(--g2),var(--g1));text-decoration:none}.bar .v{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.cb{display:grid;grid-template-columns:150px 1fr;gap:10px;margin:10px 0;font-size:12.5px}.cb .m{color:var(--mut)}
.mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.mini span{font-size:11.5px;color:var(--mut);background:#16161e;border-radius:8px;padding:2px 8px}
svg text{fill:#9a9aaa;font:600 10px Manrope}.ins{display:grid;gap:10px}.ins div{padding:12px 14px;border-radius:12px;background:#15130a;border:1px solid #4a3c14;font-size:14px}.ins b{color:var(--g1)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{font:800 10px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:7px 8px;border-bottom:1px solid #1c1c24;white-space:nowrap}.tw{overflow-x:auto}.pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800}.pn{background:#12301c;color:var(--ok)}.pr{background:#2b1a4a;color:#c8a8ff}.pg{background:#2a2a34;color:#ccc}
.gate{max-width:480px;margin:90px auto;text-align:center;padding:30px;border:1.5px solid #6a5420;border-radius:18px;background:#0e0b05}.gate a{color:var(--g2)}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--mut)}.heat i{aspect-ratio:1;border-radius:3px;display:block}.heat em{font-style:normal;text-align:center}
</style></head><body><div class="w" id="app"><div class="gate">Cargando estadísticas…</div></div>
<script>
var days=30,TZ=-new Date().getTimezoneOffset(),D=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var F=function(n){return (n||0).toLocaleString('es-AR')},T=function(s){s=s||0;return s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'};
function flag(c){return c&&c.length==2?String.fromCodePoint.apply(null,c.toUpperCase().split('').map(function(x){return 127397+x.charCodeAt(0)})):'🌐'}
function cn(c){try{return new Intl.DisplayNames(['es'],{type:'region'}).of(c)||c}catch(e){return c}}
function ago(t){var s=Math.round((Date.now()-t)/1000);return s<60?s+'s':s<3600?Math.round(s/60)+' min':s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' d'}
function bars(a,f,lab){var m=Math.max.apply(null,a.map(f).concat([1]));return a.map(function(x){return '<div class="bar"><span class="n">'+lab(x)+'</span><span class="t"><u style="width:'+Math.max(2,100*f(x)/m)+'%"></u></span><span class="v">'+F(f(x))+'</span></div>'}).join('')||'<div class="m">Sin datos todavía</div>'}
function chart(d){var W=760,H=190,p=26,m=Math.max.apply(null,d.map(function(x){return x.v}).concat([1])),bw=(W-p*2)/Math.max(d.length,1);
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';d.forEach(function(x,i){var h=(H-p*2)*x.v/m,hu=(H-p*2)*x.u/m,X=p+i*bw;s+='<rect x="'+(X+1)+'" y="'+(H-p-h)+'" width="'+Math.max(2,bw-3)+'" height="'+h+'" rx="3" fill="#6a5420"/><rect x="'+(X+1)+'" y="'+(H-p-hu)+'" width="'+Math.max(2,bw-3)+'" height="'+hu+'" rx="3" fill="#e8b84a"/>';if(i%Math.ceil(d.length/8)==0)s+='<text x="'+X+'" y="'+(H-8)+'">'+x.d.slice(5)+'</text>'});return s+'</svg>'}
function hourChart(a){var arr=Array(24).fill(0).map(function(_,h){return {h:h,u:0,v:0}});a.forEach(function(x){arr[x.h]=x});var m=Math.max.apply(null,arr.map(function(x){return x.u}).concat([1]));
 var s='<svg viewBox="0 0 760 170" width="100%">';arr.forEach(function(x,i){var h=120*x.u/m,X=14+i*30,top=x.u==m&&m>0;s+='<rect x="'+X+'" y="'+(135-h)+'" width="24" height="'+h+'" rx="4" fill="'+(top?'#fff1a8':'#e8b84a')+'" opacity="'+(top?1:.75)+'"/><text x="'+(X+12)+'" y="156" text-anchor="middle">'+x.h+'</text>'});return s+'</svg>'}
function heatmap(a){var g={},m=1;a.forEach(function(x){g[x.w+'_'+x.h]=x.v;m=Math.max(m,x.v)});var s='<div class="heat"><em></em>';for(var h=0;h<24;h++)s+='<em>'+h+'</em>';for(var w=0;w<7;w++){s+='<em style="text-align:left;padding-top:3px">'+D[w]+'</em>';for(h=0;h<24;h++){var v=g[w+'_'+h]||0;s+='<i title="'+D[w]+' '+h+'h: '+v+'" style="background:rgba(232,184,74,'+(v?(.12+.88*v/m):.05).toFixed(2)+')"></i>'}}return s+'</div>'}
function insights(d){var t=d.totals,o=[],hr=d.byHour.slice().sort(function(a,b){return b.u-a.u}).slice(0,3).map(function(x){return x.h+':00'});
 if(hr.length)o.push('<div>⏰ <b>Mejores horas para publicar y hacer promos (tu hora):</b> '+hr.join(', ')+'. Publicá 30–60 min antes del pico.</div>');
 var wd={};d.heat.forEach(function(x){wd[x.w]=(wd[x.w]||0)+x.v});var bw=Object.keys(wd).sort(function(a,b){return wd[b]-wd[a]})[0];if(bw!=null)o.push('<div>📅 <b>Mejor día:</b> '+D[bw]+' ('+F(wd[bw])+' vistas en el período).</div>');
 var inn={};d.intent.forEach(function(x){inn[x.c]=x.n});var cs=d.countries.filter(function(x){return x.u>=3}).map(function(x){return {c:x.c,r:(inn[x.c]||0)/x.u,u:x.u,dur:x.dur}}).sort(function(a,b){return b.r-a.r});
 if(cs.length&&cs[0].r>0)o.push('<div>🎯 <b>País con más intención de compra:</b> '+flag(cs[0].c)+' '+cn(cs[0].c)+' ('+Math.round(cs[0].r*100)+'% abrió el pago o clickeó Binance). Dirigí ahí tus promos y anuncios.</div>');
 if(d.countries[0])o.push('<div>🌎 <b>País que más te visita:</b> '+flag(d.countries[0].c)+' '+cn(d.countries[0].c)+' ('+F(d.countries[0].u)+' visitantes). Posteá en su horario local: ver tabla de abajo.</div>');
 if(t.uniq){var nr=Math.round(100*t.newv/t.uniq),mob=(d.devices.filter(function(x){return x.k=='Mobile'})[0]||{u:0}).u;o.push('<div>🆕 <b>'+nr+'%</b> son visitantes nuevos y <b>'+Math.round(100*t.repeat/t.uniq)+'%</b> volvió otro día. '+(nr>80?'Casi todos llegan una sola vez: sumá un botón de avisos / lista de mails para recuperarlos.':'Buena recurrencia: priorizá novedades y avisos.')+'</div>');o.push('<div>📱 <b>'+Math.round(100*mob/Math.max(1,t.uniq))+'%</b> entra desde celular: revisá que todo se vea perfecto en pantalla chica.</div>')}
 if(d.refs[0])o.push('<div>🔗 <b>De dónde llegan más:</b> '+d.refs.slice(0,3).map(function(x){return x.k+' ('+x.u+')'}).join(', ')+'. Ahí es donde conviene seguir posteando.</div>');
 if(!t.views)o.push('<div>Todavía no hay datos: empezó a registrar visitas desde este deploy. Volvé en unas horas.</div>');return o.join('')}
function render(d){
 var t=d.totals,w=d.windows,nr=t.uniq?Math.round(100*t.newv/t.uniq):0;
 document.getElementById('app').innerHTML='<div class="top"><div><h1>Estadísticas de Twerkhub</h1><div style="color:var(--mut)">Solo vos podés ver esto · '+(t.since?'datos desde '+new Date(t.since).toLocaleDateString('es-AR'):'sin datos aún')+'</div></div><div class="sel">'+[1,7,30,90].map(function(n){return '<button data-d="'+n+'" class="'+(n==days?'on':'')+'">'+(n==1?'24 h':n+' días')+'</button>'}).join(' ')+'</div></div>'+
 '<div class="kp"><div class="k"><span>Visitantes únicos</span><b>'+F(t.uniq)+'</b><i>'+F(t.allVisitors)+' en total</i></div><div class="k"><span>Vistas de página</span><b>'+F(t.views)+'</b><i>'+F(t.allViews)+' en total</i></div><div class="k"><span>Ahora online</span><b>'+F(w.online.u)+'</b><i>últimos 5 minutos</i></div><div class="k"><span>Nuevos</span><b>'+nr+'%</b><i>'+F(t.newv)+' nuevos · '+F(t.repeat)+' volvieron</i></div><div class="k"><span>Registrados</span><b>'+F(t.regv)+'</b><i>'+(t.uniq?Math.round(100*t.regv/t.uniq):0)+'% de los visitantes</i></div><div class="k"><span>Tiempo en página</span><b>'+T(t.avgdur)+'</b><i>scroll promedio '+(t.avgscroll||0)+'%</i></div><div class="k"><span>Rebote</span><b>'+(t.uniq?Math.round(100*t.single/t.uniq):0)+'%</b><i>vieron una sola página</i></div><div class="k"><span>Desbloqueos con monedas</span><b>'+F(t.unlocks)+'</b><i>total histórico</i></div></div>'+
 '<div class="g"><div class="c s12"><h2>Qué hacer con estos datos</h2><div class="ins">'+insights(d)+'</div></div>'+
 '<div class="c s8"><h2>Visitas por día <span style="color:var(--mut);font-weight:500;text-transform:none;letter-spacing:0">(dorado = únicos, marrón = vistas)</span></h2>'+chart(d.byDay)+'</div>'+
 '<div class="c s4"><h2>Ventanas</h2><div class="cb"><span class="m">Últimas 24 h</span><b>'+F(w.h24.u)+' únicos · '+F(w.h24.v)+' vistas</b></div><div class="cb"><span class="m">7 días</span><b>'+F(w.d7.u)+' únicos · '+F(w.d7.v)+' vistas</b></div><div class="cb"><span class="m">30 días</span><b>'+F(w.d30.u)+' únicos · '+F(w.d30.v)+' vistas</b></div></div>'+
 '<div class="c s12"><h2>Países (una barra por país)</h2>'+bars(d.countries,function(x){return x.u},function(x){return flag(x.c)+' '+cn(x.c)})+'</div>'+
 '<div class="c s12"><h2>Detalle por país</h2><div class="tw"><table><tr><th>País</th><th>Únicos</th><th>Vistas</th><th>Nuevos</th><th>Registrados</th><th>Tiempo prom.</th><th>Scroll</th><th>Intención de pago</th><th>Mejores horas (hora de allá)</th></tr>'+d.countries.slice(0,20).map(function(x){var inn=(d.intent.filter(function(i){return i.c==x.c})[0]||{n:0}).n,bl=(d.bestLocal.filter(function(i){return i.c==x.c})[0]||{hours:[]}).hours;return '<tr><td>'+flag(x.c)+' '+cn(x.c)+'</td><td>'+F(x.u)+'</td><td>'+F(x.v)+'</td><td>'+F(x.nv)+'</td><td>'+F(x.rv)+'</td><td>'+T(x.dur)+'</td><td>'+(x.sc||0)+'%</td><td>'+inn+' ('+Math.round(100*inn/Math.max(1,x.u))+'%)</td><td>'+(bl.length?bl.map(function(h){return h+':00'}).join(', '):'—')+'</td></tr>'}).join('')+'</table></div></div>'+
 '<div class="c s6"><h2>Horas del día (tu hora)</h2>'+hourChart(d.byHour)+'</div><div class="c s6"><h2>Día y hora (mapa de calor)</h2>'+heatmap(d.heat)+'</div>'+
 '<div class="c s4"><h2>Dispositivos</h2>'+bars(d.devices,function(x){return x.u},function(x){return x.k})+'<h2 style="margin-top:16px">Sistemas</h2>'+bars(d.oses,function(x){return x.u},function(x){return x.k})+'</div>'+
 '<div class="c s4"><h2>Navegadores</h2>'+bars(d.browsers,function(x){return x.u},function(x){return x.k})+'<h2 style="margin-top:16px">Idiomas</h2>'+bars(d.langs,function(x){return x.u},function(x){return x.k})+'</div>'+
 '<div class="c s4"><h2>De dónde llegan</h2>'+bars(d.refs,function(x){return x.u},function(x){return x.k})+'<h2 style="margin-top:16px">Ciudades</h2>'+bars(d.cities.slice(0,8),function(x){return x.u},function(x){return x.city+' '+flag(x.c)})+'</div>'+
 '<div class="c s6"><h2>Páginas más vistas</h2><div class="tw"><table><tr><th>Página</th><th>Vistas</th><th>Únicos</th><th>Tiempo</th><th>Scroll</th></tr>'+d.pages.map(function(x){return '<tr><td>'+x.path+'</td><td>'+F(x.v)+'</td><td>'+F(x.u)+'</td><td>'+T(x.dur)+'</td><td>'+(x.sc||0)+'%</td></tr>'}).join('')+'</table></div></div>'+
 '<div class="c s6"><h2>Acciones de intención</h2>'+bars(d.events,function(x){return x.n},function(x){return {pay_open:'Abrió el pago',unlock_click:'Click en desbloquear',follow:'Activó avisos',binance_ref:'Click a Binance (referido)',rabbit_click:'Atrapó el conejo'}[x.name]||x.name})+'</div>'+
 '<div class="c s12"><h2>Últimos visitantes</h2><div class="tw"><table><tr><th>Hace</th><th>ID</th><th>País</th><th>Ciudad</th><th>Equipo</th><th>Origen</th><th>Página</th><th>Tiempo</th><th>Scroll</th><th>Tipo</th></tr>'+d.recent.map(function(x){return '<tr><td>'+ago(x.ts)+'</td><td>'+x.vid+'</td><td>'+flag(x.country)+' '+(x.country||'?')+'</td><td>'+(x.city||'—')+'</td><td>'+x.device+' · '+x.browser+' · '+x.os+'</td><td>'+(x.ref||'directo')+'</td><td>'+x.path+'</td><td>'+T(x.dur)+'</td><td>'+(x.scroll||0)+'%</td><td><span class="pill '+(x.is_new?'pn':'pg')+'">'+(x.is_new?'nuevo':'vuelve')+'</span> '+(x.reg?'<span class="pill pr">registrado</span>':'')+'</td></tr>'}).join('')+'</table></div></div></div>';
 document.querySelectorAll('.sel button').forEach(function(b){b.onclick=function(){days=+b.dataset.d;load()}})}
function load(){fetch('/api/analytics/stats?days='+days+'&tz='+(-new Date().getTimezoneOffset()),{credentials:'same-origin'}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})}).then(function(x){if(x.s==403||!x.j.ok){document.getElementById('app').innerHTML='<div class="gate"><h1>Solo para el dueño</h1><p>Iniciá sesión con tu cuenta principal y volvé a entrar.</p><p><a href="/account.html">Iniciar sesión</a></p></div>';return}render(x.j)}).catch(function(){document.getElementById('app').innerHTML='<div class="gate">No pude cargar los datos. Probá de nuevo.</div>'})}
load();setInterval(function(){if(!document.hidden)load()},60000);
</script></body></html>
