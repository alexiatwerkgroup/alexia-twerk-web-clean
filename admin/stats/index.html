<style>

.map{width:100%;height:auto;background:radial-gradient(60% 80% at 50% 40%,#10101a,#07070b);border-radius:12px}.map path{stroke:#07070b;stroke-width:.5}.map .pt{fill:#5df08a;opacity:.9}.map .rg{fill:none;stroke:#5df08a;stroke-width:1.5;animation:rg 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes rg{0%{transform:scale(.5);opacity:.9}100%{transform:scale(3.2);opacity:0}}

body[data-admin-mode=matrix]{--bg:#030905;--card:#06180bb0;--line:#1a6337;--fg:#baffcc;--mut:#74ae84;--g1:#b3ffca;--g2:#39f17b;--g3:#0d6132;--ok:#4eff91;--pk:#53ff8b;background:radial-gradient(ellipse at 45% 0,#0a2512,#020704 70%);font-family:Consolas,monospace}body[data-admin-mode=matrix] .c,body[data-admin-mode=matrix] .k{background:#05180d9c;border-color:#23824780;backdrop-filter:blur(14px);box-shadow:0 0 22px #00ff6610;transform:none}body[data-admin-mode=matrix] h1,body[data-admin-mode=matrix] h2,body[data-admin-mode=matrix] th,body[data-admin-mode=matrix] .user-nick{font-family:Consolas,monospace;color:#64ff98}body[data-admin-mode=matrix] #user-hover-info{background:#04170bbd;color:#a9ffc5;border:1px solid #47ff8c88;border-radius:5px;backdrop-filter:blur(18px);font-family:Consolas,monospace;box-shadow:0 0 34px #00ff6420}body[data-admin-mode=matrix] .user-nick{border-color:#45ff89}body[data-admin-mode=matrix] .admin-ai-menu{background:#031b0bba;border-color:#38f87d;color:#8bffb2}body[data-admin-mode=matrix] .top .sel button.on{background:#153d23;color:#c5ffd6}body[data-admin-mode=matrix] .k b{color:#84ffab;text-shadow:0 0 13px #0f64}body[data-admin-mode=matrix] .tg{background:#143d22;color:#79ffa4}
</style></head><body><div class="w" id="app"><div class="gate">Cargando estadísticas…</div></div>
<script>
var bots=0,days=1,lastOk=0,TZ=-new Date().getTimezoneOffset(),D=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var F=function(n){return (n||0).toLocaleString('es-AR')},T=function(s){s=s||0;return s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'};
function pageLink(path){var label=String(path||'/'),esc=function(v){return v.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};try{var u=new URL(label,location.origin);if(u.origin!==location.origin||!/^https?:$/.test(u.protocol))return esc(label);return '<a class="page-link" href="'+esc(u.pathname+u.search+u.hash)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>'}catch(e){return esc(label)}}
function flag(c){return c&&c.length==2?String.fromCodePoint.apply(null,c.toUpperCase().split('').map(function(x){return 127397+x.charCodeAt(0)})):'🌐'}
function cn(c){try{return new Intl.DisplayNames(['es'],{type:'region'}).of(c)||c}catch(e){return c}}
function ago(t){var s=Math.round((Date.now()-t)/1000);return s<60?s+'s':s<3600?Math.round(s/60)+' min':s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' d'}
function bars(a,f,lab){var m=Math.max.apply(null,a.map(f).concat([1]));return a.map(function(x){return '<div class="bar"><span class="n">'+lab(x)+'</span><span class="t"><u style="width:'+Math.max(2,100*f(x)/m)+'%"></u></span><span class="v">'+F(f(x))+'</span></div>'}).join('')||'<div class="m">Sin datos todavía</div>'}
function chart(d){var W=760,H=190,p=26,m=Math.max.apply(null,d.map(function(x){return x.v}).concat([1])),bw=(W-p*2)/Math.max(d.length,1);
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';d.forEach(function(x,i){var h=(H-p*2)*x.v/m,hu=(H-p*2)*x.u/m,X=p+i*bw;s+='<rect x="'+(X+1)+'" y="'+(H-p-h)+'" width="'+Math.max(2,bw-3)+'" height="'+h+'" rx="3" fill="#6a5420"/><rect x="'+(X+1)+'" y="'+(H-p-hu)+'" width="'+Math.max(2,bw-3)+'" height="'+hu+'" rx="3" fill="#e8b84a"/>';if(i%Math.ceil(d.length/8)==0)s+='<text x="'+X+'" y="'+(H-8)+'">'+x.d.slice(5)+'</text>'});return s+'</svg>'}
function hourChart(a){var arr=Array(24).fill(0).map(function(_,h){return {h:h,u:0,v:0}});a.forEach(function(x){arr[x.h]=x});var m=Math.max.apply(null,arr.map(function(x){return x.u}).concat([1]));
 var s='<svg viewBox="0 0 760 170" width="100%">';arr.forEach(function(x,i){var h=120*x.u/m,X=14+i*30,top=x.u==m&&m>0;s+='<rect x="'+X+'" y="'+(135-h)+'" width="24" height="'+h+'" rx="4" fill="'+(top?'#fff1a8':'#e8b84a')+'" opacity="'+(top?1:.75)+'"/><text x="'+(X+12)+'" y="156" text-anchor="middle">'+x.h+'</text>'});return s+'</svg>'}
function heatmap(a){var g={},m=1;a.forEach(function(x){g[x.w+'_'+x.h]=x.v;m=Math.max(m,x.v)});var s='<div class="heat"><em></em>';for(var h=0;h<24;h++)s+='<em>'+h+'</em>';for(var w=0;w<7;w++){s+='<em style="text-align:left;padding-top:3px">'+D[w]+'</em>';for(h=0;h<24;h++){var v=g[w+'_'+h]||0;s+='<i title="'+D[w]+' '+h+'h: '+v+'" style="background:rgba(232,184,74,'+(v?(.12+.88*v/m):.05).toFixed(2)+')"></i>'}}return s+'</div>'}

var EVN={pay_open:'Abrió el pago',copy_id:'Copió el ID de Binance',binance_ref:'Click en crear cuenta Binance',unlock_click:'Click en desbloquear',follow:'Activó avisos',rabbit_click:'Atrapó el conejo'};
function peakChart(d){var m=d.v2.mins,W=900,H=190,p=30,now=Math.floor(Date.now()/300000),t0=now-575,mx=Math.max.apply(null,m.map(function(x){return x.u}).concat([3]));
 var X=function(b){return p+(b-t0)/575*(W-2*p)},Y=function(u){return H-p-(H-2*p)*u/mx},byb={};m.forEach(function(x){byb[x.b]=x.u});var pts=[];for(var b=t0;b<=now;b++)pts.push(X(b).toFixed(1)+','+Y(byb[b]||0).toFixed(1));
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><polyline points="'+pts.join(' ')+'" fill="none" stroke="#e8b84a" stroke-width="2" stroke-linejoin="round"/><polyline points="'+X(t0)+','+(H-p)+' '+pts.join(' ')+' '+X(now)+','+(H-p)+'" fill="#e8b84a22"/>';
 for(var i=0;i<=8;i++){var tt=(now-575+i*72)*300000;s+='<text x="'+X(t0+i*72)+'" y="'+(H-8)+'" text-anchor="middle">'+new Date(tt).getHours()+':00</text>'}
 d.v2.peaks.forEach(function(k){var b=k.ts/300000;if(b>=t0)s+='<circle cx="'+X(b+6)+'" cy="'+(Y(k.u)-2)+'" r="5" fill="#ff5a3d"/>'});
 d.v2.marks.forEach(function(k){var b=k.ts/300000;if(b>=t0&&b<=now+1)s+='<line x1="'+X(b)+'" x2="'+X(b)+'" y1="'+p+'" y2="'+(H-p)+'" stroke="#35d6ff" stroke-dasharray="4 3"/><text x="'+X(b)+'" y="'+(p-6)+'" text-anchor="middle" style="fill:#35d6ff">'+(k.channel||'promo')+'</text>'});
 return s+'</svg><div style="font-size:11.5px;color:var(--mut)">Últimas 48 h, visitantes cada 5 min. Línea celeste = promo marcada. Punto rojo = pico detectado.</div>'}
function peakList(d){var k=d.v2.peaks.slice(-4).reverse();return k.length?k.map(function(x){return '<div class="pk"><b>Pico</b> '+new Date(x.ts).toLocaleString('es-AR',{weekday:'short',hour:'2-digit',minute:'2-digit'})+' · <b>'+x.u+' visitantes</b> en una hora'+(x.x?' ('+x.x+'× lo normal)':'')+(x.ref?' · vinieron de <b>'+x.ref+'</b> ('+x.refU+')':' · sin origen claro (directo)')+(x.country?' · sobre todo '+flag(x.country)+' '+cn(x.country):'')+'</div>'}).join(''):'<div style="color:var(--mut);font-size:13px">Todavía no hay picos: aparecen cuando una hora se dispara por encima de lo habitual.</div>'}
function marksList(d){return d.v2.marks.slice(0,6).map(function(k){return '<div class="mk"><span class="pill pg">'+(k.channel||'promo')+'</span><span>'+k.label+'</span><span style="color:var(--mut)">'+new Date(k.ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span><u data-del="'+k.id+'">borrar</u></div>'}).join('')}
function funnel(d){var u=function(n,dt){var r=0;d.v2.evU.forEach(function(x){if(x.name==n&&(dt==null||x.detail==dt))r+=x.u});return r},t=Math.max(1,d.totals.uniq);
 var rows=[['Visitantes',d.totals.uniq],['Entraron a Jenny',d.v2.landed],['Abrieron el pago (monedas)',u('pay_open','coins')],['Abrieron el pago (pack $19.99)',u('pay_open','pack')],['Copiaron el ID de Binance',u('copy_id')],['Click en crear cuenta Binance',u('binance_ref')],['Click en desbloquear',u('unlock_click')],['Activaron avisos',u('follow')]];
 return rows.map(function(r){return '<div class="fn"><span>'+r[0]+'</span><span class="t"><u style="width:'+Math.max(r[1]?3:0,100*r[1]/t)+'%"></u></span><span class="v">'+F(r[1])+' · '+Math.round(100*r[1]/t)+'%</span></div>'}).join('')}
var PG={'/':'Inicio','/jenny/':'Jenny (catálogo)','/jenny/uncensored/':'Jenny Uncensored','/account.html':'Mi cuenta','/login.html':'Login','/playlist/':'Playlists'};
function pgName(p){if(PG[p])return PG[p];if(/^\/jenny\/uncensored/.test(p))return 'Jenny Uncensored';if(/^\/jenny/.test(p))return 'Jenny';if(/^\/playlist|^\/try-on|^\/hottest|^\/korean|^\/ttl/.test(p))return 'Playlist: '+p.replace(/\//g,' ').trim().slice(0,28);return p.slice(0,34)}
var USER_DETAILS={},REGISTERED_USERS=[],ACCOUNT_TOTAL=0;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function userBadge(u){var p=u.profile;if(!p)return u.reg?'<span class="pill pr">Registrado sin ficha disponible</span>':'<span>'+esc(u.isNew||u.is_new?'Visitante nuevo':'Visitante que volvió')+'</span>';var key=encodeURIComponent(p.id);USER_DETAILS[key]={profile:p,visit:u};return '<button type="button" class="user-nick" data-user="'+esc(key)+'" aria-describedby="user-hover-info">'+esc(p.username||'Usuario registrado sin nick')+'</button>'}
function showUserInfo(el){var d=USER_DETAILS[el.dataset.user];if(!d)return;var p=d.profile,u=d.visit,tip=document.getElementById('user-hover-info');if(!tip){tip=document.createElement('div');tip.id='user-hover-info';tip.setAttribute('role','tooltip');document.body.appendChild(tip)}var date=function(v){return v?String(v):'Sin dato'};tip.textContent=[p.username||'Usuario registrado sin nick','Email: '+(p.email||'Sin dato'),'País: '+(p.country?cn(p.country):(u.country?cn(u.country):'Sin dato')),'Pagos confirmados: '+paidLabel(p),'Entradas registradas: '+(p.recorded_visits==null?'Sin registro':F(p.recorded_visits)),'Nivel: '+(p.tier||'Sin dato'),'Tokens: '+F(p.tokens)+' · Racha: '+F(p.streak),'Registro: '+date(p.registered_at),'Último ingreso: '+date(p.last_login_date),'Última actividad registrada: '+date(p.last_seen_at),'Tiempo total: '+T(p.seconds_on_site)+' · Videos vistos: '+F(p.cuts_watched),'Ubicación: '+[u.city,u.country].filter(Boolean).join(', '),'Equipo: '+[u.device,u.browser,u.os].filter(Boolean).join(' · '),'Origen: '+(u.ref||'directo')].join('\n');tip.hidden=false;var r=el.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-tip.offsetHeight-8))+'px'}
function hideUserInfo(){var t=document.getElementById('user-hover-info');if(t)t.hidden=true}
document.addEventListener('mouseover',function(e){var el=e.target.closest('[data-user]');if(el)showUserInfo(el);else hideUserInfo()});

document.addEventListener('keydown',function(e){if(e.key==='Escape')hideUserInfo()});document.addEventListener('scroll',hideUserInfo,true);window.addEventListener('blur',hideUserInfo);
