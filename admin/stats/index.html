<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Estadísticas · Twerkhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap">
<style>
:root{--bg:#07070b;--card:#0e0e14;--line:#2a2a34;--fg:#f4f4f8;--mut:#9a9aaa;--g1:#fff1a8;--g2:#e8b84a;--g3:#9a6410;--ok:#5df08a;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Manrope,system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:1200px;margin:auto}h1{font:800 26px Manrope;margin:0}h2{font:800 12px Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);margin:0 0 12px}
h2 small{font:500 12px Manrope;letter-spacing:0;text-transform:none;color:var(--mut);margin-left:8px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.btn{background:#14141c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:800 12px Manrope;cursor:pointer;text-decoration:none;display:inline-block}.btn.on{background:linear-gradient(180deg,var(--g1),var(--g2));color:#1a1204;border-color:var(--g1)}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.status{display:flex;gap:18px;flex-wrap:wrap;font:600 12px Manrope;color:var(--mut);margin:0 0 14px}.status b{color:var(--fg)}.status .ok{color:var(--ok)}.status .bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:6px;animation:lv 1.6s infinite}.dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:none}@keyframes lv{50%{opacity:.3}}
.def{border:1px solid #4a3c14;background:#15130a;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#d9cfae}.def summary{cursor:pointer;font:800 12px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--g2)}.def ul{margin:10px 0 0;padding-left:18px}.def li{margin:4px 0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.k{padding:16px;border-radius:16px;background:linear-gradient(180deg,#1b1608,#0b0905);border:1.5px solid #6a5420;box-shadow:0 0 22px #e8b84a18}
.k b{display:block;font:900 34px/1.1 "Arial Black",system-ui;color:var(--g1);text-shadow:0 2px 0 #7a4c0a}.k span{font:800 11px Manrope;letter-spacing:.1em;text-transform:uppercase;color:#c9b27a}.k i{display:block;font:500 12px Manrope;color:var(--mut);font-style:normal;margin-top:3px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}@media(max-width:900px){.s8,.s6,.s4{grid-column:span 12}}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:13px}.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .t{height:12px;border-radius:99px;background:#1a1a22;overflow:hidden}.bar .t u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g3),var(--g2),var(--g1))}.bar .v{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{font:800 10px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:7px 8px;border-bottom:1px solid #1c1c24;vertical-align:top}.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;margin:1px 3px 1px 0}.pc{background:#12301c;color:var(--ok)}.pw{background:#2a2a34;color:#ccc}.pa{background:#2b1a4a;color:#c8a8ff}.pt{background:#2a2208;color:var(--g1)}
.m{color:var(--mut)}.feed div{padding:7px 0;border-bottom:1px solid #1c1c24;font-size:13px}.feed small{color:var(--mut)}
a.pl{color:var(--g1);text-decoration:underline;text-underline-offset:3px}
svg text{fill:#9a9aaa;font:600 10px Manrope}
.frm{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}.frm input,.frm select{background:#14141c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 13px Manrope}.frm input[type=text]{flex:1;min-width:160px}
.mk{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #1c1c24;font-size:13px}.mk u{margin-left:auto;color:var(--mut);cursor:pointer}
.gate{max-width:480px;margin:90px auto;text-align:center;padding:30px;border:1.5px solid #6a5420;border-radius:18px;background:#0e0b05}
.admin-ai{position:fixed;right:20px;bottom:22px;z-index:10001}.admin-ai>button{padding:12px 18px;border:1px solid var(--g2);border-radius:10px;background:#11121bea;color:var(--g1);font:800 12px monospace;cursor:pointer}.admin-ai-menu{position:absolute;bottom:52px;right:0;min-width:210px;padding:8px;background:#0e1019e8;border:1px solid var(--g2);backdrop-filter:blur(18px);border-radius:10px}.admin-ai-menu button{display:block;width:100%;background:transparent;border:0;color:var(--g1);text-align:left;padding:12px;cursor:pointer;font:700 13px monospace}.admin-ai-menu button:hover{background:#ffffff0b}
body[data-admin-mode=matrix]{--bg:#030905;--card:#06180bb0;--line:#1a6337;--fg:#baffcc;--mut:#74ae84;--g1:#b3ffca;--g2:#39f17b;--g3:#0d6132;--ok:#4eff91;background:radial-gradient(ellipse at 45% 0,#0a2512,#020704 70%);font-family:Consolas,monospace}body[data-admin-mode=matrix] .c,body[data-admin-mode=matrix] .k{background:#05180d9c;border-color:#23824780;box-shadow:none}body[data-admin-mode=matrix] .btn.on{background:#153d23;color:#c5ffd6}body[data-admin-mode=matrix] .k b{color:#84ffab;text-shadow:none}
</style></head><body><div class="w" id="app"><div class="gate">Cargando estadísticas…</div></div>
<script>
(function () {
'use strict';
var LIVE_MS = 5000, REPORT_MS = 3600000;
var days = 30, TZ = -new Date().getTimezoneOffset();
var live = null, rep = null, liveOkAt = 0, repOkAt = 0, liveBusy = false, repBusy = false, liveFail = 0, repFail = 0;
var uncOpen = false, denied = false, seenActionTs = 0, seenOnline = null, soundOn = false, audio = null;
try { soundOn = localStorage.getItem('twk-visitor-sound') === '1'; } catch (e) {}

var EV = { unlock_click: 'Clic en desbloquear', pay_open: 'Abrió el pago', copy_id: 'Copió el ID de Binance', binance_ref: 'Clic en crear cuenta Binance', follow: 'Activó avisos', rabbit_click: 'Clic al conejo', nov_watch: 'Entró a un canal de Novinhas', nov_play: 'Reprodujo un video de Novinhas', nov_join: 'Abrió el registro (Novinhas)', nov_signup: 'Se registró desde Novinhas', signup_done: 'Se registró' };
var DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function F(n) { return (Number(n) || 0).toLocaleString('es-AR'); }
function T(s) { s = Math.round(s || 0); return s >= 3600 ? Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min' : s >= 60 ? Math.floor(s / 60) + ' min ' + (s % 60) + ' s' : s + ' s'; }
function ago(t) { var s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + ' s' : s < 3600 ? Math.round(s / 60) + ' min' : s < 86400 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d'; }
function flag(c) { return c && c.length === 2 ? String.fromCodePoint.apply(null, c.toUpperCase().split('').map(function (x) { return 127397 + x.charCodeAt(0); })) : '🌐'; }
function cn(c) { try { return new Intl.DisplayNames(['es'], { type: 'region' }).of(c) || c; } catch (e) { return c; } }
function place(country, city) { return flag(country) + ' ' + (country ? esc(cn(country)) : 'País sin dato') + (city ? ' · ' + esc(city) : ''); }
function pl(path) { var p = String(path || '/'); return '<a class="pl" href="' + esc(p.split('?')[0]) + '" target="_blank" rel="noopener noreferrer">' + esc(p.length > 46 ? p.slice(0, 46) + '…' : p) + '</a>'; }
function badges(reasons) { var m = { tiempo: ['pt', '60 s+ en una página'], cuenta: ['pa', 'con cuenta'], 'acción': ['pc', 'hizo una acción'] }; return reasons.map(function (r) { return '<span class="pill ' + m[r][0] + '">' + m[r][1] + '</span>'; }).join(''); }
function bars(rows, key, label) { var max = Math.max.apply(null, rows.map(function (r) { return r[key]; }).concat([1])); return rows.length ? rows.map(function (r) { return '<div class="bar"><span class="n" title="' + esc(label(r)) + '">' + esc(label(r)) + '</span><span class="t"><u style="width:' + Math.max(2, 100 * r[key] / max) + '%"></u></span><span class="v">' + F(r[key]) + '</span></div>'; }).join('') : '<div class="m">Sin datos en este período</div>'; }

function api(path) {
  return fetch(path, { credentials: 'same-origin', cache: 'no-store', signal: AbortSignal.timeout(30000) }).then(function (r) {
    if (r.status === 403) { denied = true; throw new Error('owner_only'); }
    return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ('http_' + r.status)); return j; });
  });
}

/* ---------- sonido: solo con una acción real o una persona confirmada nueva ---------- */
function bubble() { if (!soundOn || !audio || audio.state !== 'running') return; var t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(820, t); o.frequency.exponentialRampToValueAtTime(430, t + .085); o.frequency.exponentialRampToValueAtTime(620, t + .17); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.055, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .25); o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + .26); }
function armAudio() { if (!soundOn) return; try { var AC = window.AudioContext || window.webkitAudioContext; audio = audio || new AC(); audio.resume(); } catch (e) {} }
document.addEventListener('pointerdown', armAudio, { passive: true });
document.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'unc') uncOpen = e.target.open; }, true);
function checkSound(d) {
  var acts = d.recentActions || [], newest = acts.length ? acts[0].ts : 0, ring = false;
  if (seenActionTs && newest > seenActionTs) ring = true;
  if (newest) seenActionTs = Math.max(seenActionTs, newest);
  var now = {}; (d.online || []).forEach(function (o) { if (o.confirmed) now[o.vid] = 1; });
  if (seenOnline) Object.keys(now).forEach(function (v) { if (!seenOnline[v]) ring = true; });
  seenOnline = now; if (ring) bubble();
}

/* ---------- gráficos ---------- */
function dayChart(r) {
  var map = {}; r.byDay.forEach(function (x) { map[x.d] = x.u; });
  var ds = []; var end = new Date(r.now + r.tz * 60000); end.setUTCHours(0, 0, 0, 0);
  for (var i = r.days - 1; i >= 0; i--) { var dt = new Date(end.getTime() - i * 86400000); ds.push(dt.toISOString().slice(0, 10)); }
  var W = 900, H = 200, p = 28, m = Math.max.apply(null, ds.map(function (d) { return map[d] || 0; }).concat([1])), bw = (W - 2 * p) / ds.length;
  var markDay = {}; r.marks.forEach(function (k) { var d = new Date(k.ts + r.tz * 60000).toISOString().slice(0, 10); (markDay[d] = markDay[d] || []).push(k.channel || 'promo'); });
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">';
  ds.forEach(function (d, i) { var v = map[d] || 0, h = (H - 2 * p) * v / m, x = p + i * bw;
    s += '<rect x="' + (x + 1) + '" y="' + (H - p - h) + '" width="' + Math.max(2, bw - 3) + '" height="' + h + '" rx="3" fill="#e8b84a"><title>' + d + ': ' + v + ' visitantes confirmados</title></rect>';
    if (v) s += '<text x="' + (x + bw / 2) + '" y="' + (H - p - h - 4) + '" text-anchor="middle">' + v + '</text>';
    if (markDay[d]) s += '<path d="M' + (x + bw / 2) + ' ' + (H - p + 4) + ' l5 9 h-10 z" fill="#35d6ff"><title>' + esc(markDay[d].join(', ')) + '</title></path>';
    if (i % Math.ceil(ds.length / 10) === 0) s += '<text x="' + x + '" y="' + (H - 4) + '">' + d.slice(5) + '</text>'; });
  return s + '</svg>';
}
function hourChart(rows) {
  var a = []; for (var h = 0; h < 24; h++) a.push(0); rows.forEach(function (x) { a[x.h] = x.u; });
  var m = Math.max.apply(null, a.concat([1])), s = '<svg viewBox="0 0 760 170" width="100%">';
  a.forEach(function (u, i) { var h = 120 * u / m, x = 14 + i * 30; s += '<rect x="' + x + '" y="' + (135 - h) + '" width="24" height="' + h + '" rx="4" fill="#e8b84a" opacity="' + (u === m && m > 0 ? 1 : .75) + '"><title>' + i + ':00 · ' + u + '</title></rect><text x="' + (x + 12) + '" y="156" text-anchor="middle">' + i + '</text>'; });
  return s + '</svg>';
}

/* ---------- secciones ---------- */
function defBox() {
  var s = (live && live.confirmSeconds) || 60;
  return '<details class="def"><summary>Cómo se cuenta cada número (leer una vez)</summary><ul>' +
    '<li><b>Carga</b>: una página que se abrió y quedó registrada. <b>Cookie</b>: un navegador distinto.</li>' +
    '<li><b>Visitante confirmado</b>: una cookie que cumple al menos una de estas tres cosas: tuvo <b>' + s + ' s o más de tiempo activo seguidos en una misma página</b> (con la pestaña visible; los segundos de páginas distintas no se suman), <b>tiene una cuenta</b> con sesión iniciada, o <b>hizo una acción medida</b> (clic en pago o desbloqueo, reproducir un video de Novinhas, registrarse, etc.).</li>' +
    '<li>Las cookies que solo cargaron páginas, sin ninguna de esas tres cosas, <b>no se cuentan como visitantes</b>. Se muestran aparte como «cargas sin confirmar», con su número real, para que nada quede escondido.</li>' +
    '<li><b>Ahora en el sitio</b>: pestañas que mandaron señal en los últimos 90 s (la pestaña avisa cada 30 s mientras está visible). Cada una indica si ya está confirmada y por qué.</li>' +
    '<li>Todos los números con «Hoy» cuentan desde las 00:00 de tu zona horaria. Los del período cuentan hacia atrás desde ahora.</li></ul></details>';
}
function liveKpis(d) {
  var onC = (d.online || []).filter(function (o) { return o.confirmed; }).length, onAll = d.onlineCookies;
  return '<div class="kp">' +
    '<div class="k"><span>Ahora en el sitio</span><b>' + F(onC) + '</b><i>confirmados · ' + F(onAll) + ' pestañas con señal en los últimos ' + d.onlineSeconds + ' s</i></div>' +
    '<div class="k"><span>Hoy · visitantes confirmados</span><b>' + F(d.today.confirmed) + '</b><i>' + F(d.today.loads) + ' cargas de ' + F(d.today.cookies) + ' cookies desde las 00:00</i></div>' +
    '<div class="k"><span>Última hora · confirmados</span><b>' + F(d.lastHour.confirmed) + '</b><i>' + F(d.lastHour.loads) + ' cargas de ' + F(d.lastHour.cookies) + ' cookies</i></div>' +
    '<div class="k"><span>Cuentas nuevas hoy</span><b>' + F(d.accounts.today) + '</b><i>' + F(d.accounts.total) + ' cuentas en total</i></div>' +
    '<div class="k"><span>Acciones hoy</span><b>' + F(d.today.actions) + '</b><i>clics medidos de intención y registro</i></div></div>';
}
function onlineTable(list, d, emptyMsg) {
  var rows = list.map(function (o) {
    var state = o.confirmed ? badges(o.reasons) : '<span class="pill pw">sin confirmar</span><br><span class="m">' + Math.min(o.maxDur24h, 999) + ' s en su mejor página, de ' + d.confirmSeconds + ' s</span>';
    var who = (o.user ? '<b>' + esc(o.user) + '</b><br>' : '<b>Visitante sin cuenta</b><br>') + '<span class="m">' + place(o.country, o.city) + ' · ' + esc([o.device, o.browser, o.os].filter(Boolean).join(' · ')) + '</span>';
    var ev = o.events.length ? o.events.map(function (e) { return esc(EV[e.name] || e.name) + ' <span class="m">(hace ' + ago(e.ts) + ')</span>'; }).join('<br>') : '<span class="m">solo mirando</span>';
    return '<tr><td>' + who + '</td><td>' + pl(o.path) + '</td><td>' + state + '</td><td>hace ' + ago(o.lastSignal) + '</td><td>' + T(o.dur) + ' · ' + o.scroll + '%</td><td>' + esc(o.ref || 'directo') + '</td><td>' + ev + '</td></tr>';
  }).join('');
  return '<div class="tw"><table><tr><th>Quién</th><th>Dónde está</th><th>Estado</th><th>Última señal</th><th>Tiempo / scroll en esta página</th><th>Vino de</th><th>Qué hizo</th></tr>' + (rows || '<tr><td colspan="7" class="m">' + emptyMsg + '</td></tr>') + '</table></div>';
}
function liveHtml(d) {
  var acts = (d.recentActions || []).map(function (e) { return '<div>' + esc(EV[e.name] || e.name) + (e.detail && e.name !== 'nov_watch' && e.name !== 'nov_play' ? ' · ' + esc(e.detail) : '') + '<br><small>' + (e.user ? esc(e.user) + ' · ' : '') + place(e.country, e.city) + ' · hace ' + ago(e.ts) + '</small></div>'; }).join('') || '<div class="m">Todavía no hay acciones</div>';
  var accs = (d.latestAccounts || []).map(function (a) { var t = new Date(String(a.registered_at).replace(' ', 'T') + 'Z'); return '<div><b>' + esc(a.username || 'sin nombre') + '</b> <span class="pill pw">' + esc(a.tier || '—') + '</span><br><small>registrada ' + (isNaN(t) ? esc(a.registered_at) : 'hace ' + ago(t.getTime())) + '</small></div>'; }).join('');
  var conf = (d.online || []).filter(function (o) { return o.confirmed; }), unc = (d.online || []).filter(function (o) { return !o.confirmed; });
  var uncBox = '<details id="unc"' + (uncOpen ? ' open' : '') + ' style="margin-top:14px"><summary class="m" style="cursor:pointer">Ver las ' + unc.length + ' pestañas con señal que todavía no están confirmadas (menos de ' + d.confirmSeconds + ' s, sin cuenta y sin acción)</summary>' + onlineTable(unc, d, 'Ninguna') + '</details>';
  return liveKpis(d) + '<div class="g"><div class="c s12"><h2>Quién está en el sitio ahora<small>confirmados · se actualiza cada 5 segundos</small></h2>' + onlineTable(conf, d, 'Ningún visitante confirmado en este momento') + uncBox + '</div>' +
    '<div class="c s6"><h2>Últimas acciones</h2><div class="feed">' + acts + '</div></div>' +
    '<div class="c s6"><h2>Últimas cuentas creadas</h2><div class="feed">' + accs + '</div></div></div>';
}
function repHtml(r) {
  var k = r.kpi, pct = k.cookies ? (100 * k.confirmed / k.cookies).toFixed(1).replace('.', ',') : '0';
  var kp = '<div class="kp">' +
    '<div class="k"><span>Visitantes confirmados</span><b>' + F(k.confirmed) + '</b><i>de ' + F(k.cookies) + ' cookies (' + pct + '%)</i></div>' +
    '<div class="k"><span>Por qué están confirmados</span><b style="font-size:20px;line-height:1.5">' + F(k.byTime) + ' por tiempo<br>' + F(k.byAccount) + ' con cuenta<br>' + F(k.byAction) + ' por acción</b><i>una misma persona puede cumplir varias</i></div>' +
    '<div class="k"><span>Tiempo activo por confirmado</span><b>' + T(k.avgSeconds) + '</b><i>promedio en el período</i></div>' +
    '<div class="k"><span>Cuentas nuevas</span><b>' + F(k.accountsInPeriod) + '</b><i>' + F(k.accountsTotal) + ' en total</i></div>' +
    '<div class="k"><span>Acciones medidas</span><b>' + F(k.actions) + '</b><i>clics de intención y registro</i></div>' +
    '<div class="k"><span>Cargas sin confirmar</span><b>' + F(k.unconfirmedLoads) + '</b><i>de ' + F(k.unconfirmedCookies) + ' cookies sin 60 s, cuenta ni acción · no cuentan como visitantes</i></div></div>';
  var marks = r.marks.slice(0, 8).map(function (m) { return '<div class="mk"><span class="pill pw">' + esc(m.channel || 'promo') + '</span><span>' + esc(m.label) + '</span><span class="m">' + new Date(m.ts).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</span><u data-del="' + Number(m.id) + '">borrar</u></div>'; }).join('');
  var vis = r.visitors.map(function (v) {
    var who = (v.user ? '<b>' + esc(v.user) + '</b><br>' : '') + '<span class="m">' + place(v.country, v.city) + '</span>';
    return '<tr><td>' + new Date(v.last).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</td><td>' + who + '</td><td>' + esc([v.device, v.browser, v.os].filter(Boolean).join(' · ')) + '</td><td>' + esc(v.ref || 'directo') + '</td><td>' + badges(v.reasons) + '</td><td>' + T(v.dur) + '</td><td>' + F(v.loads) + '</td><td>' + v.pages.map(pl).join('<br>') + (v.morePages ? '<br><span class="m">+' + v.morePages + ' más</span>' : '') + '</td><td>' + (v.events.length ? v.events.map(function (e) { return esc(EV[e.split(' · ')[0]] || e); }).join('<br>') : '<span class="m">—</span>') + '</td></tr>';
  }).join('');
  return '<div class="top" style="margin-top:22px"><h1 style="font-size:20px">Histórico · últimos ' + (r.days === 1 ? '24 horas' : r.days + ' días') + '</h1><span class="m">Se actualiza cada 1 hora · calculado ' + new Date(r.now).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + '</span></div>' + kp +
    '<div class="g"><div class="c s12"><h2>Visitantes confirmados por día<small>▲ celeste = promo marcada</small></h2>' + dayChart(r) +
    '<div class="frm"><input type="text" id="ml" placeholder="Qué publicaste (ej: post en Reddit)" maxlength="80"><select id="mc"><option>reddit</option><option>x</option><option>telegram</option><option>instagram</option><option>foro</option><option>otro</option></select><input type="datetime-local" id="mt"><button class="btn" id="ma" type="button">Marcar promo</button></div>' + marks + '</div>' +
    '<div class="c s6"><h2>Horas del día<small>visitantes confirmados, en tu hora</small></h2>' + hourChart(r.byHour) + '</div>' +
    '<div class="c s6"><h2>De dónde llegan<small>origen de la primera visita de cada confirmado</small></h2>' + bars(r.refs, 'u', function (x) { return x.k; }) + '</div>' +
    '<div class="c s4"><h2>Países</h2>' + bars(r.countries, 'u', function (x) { return flag(x.c) + ' ' + cn(x.c); }) + '</div>' +
    '<div class="c s4"><h2>Ciudades</h2>' + bars(r.cities, 'u', function (x) { return flag(x.c) + ' ' + x.city; }) + '</div>' +
    '<div class="c s4"><h2>Dispositivos</h2>' + bars(r.devices, 'u', function (x) { return x.k; }) + '<h2 style="margin-top:14px">Sistemas</h2>' + bars(r.oses, 'u', function (x) { return x.k; }) + '<h2 style="margin-top:14px">Navegadores</h2>' + bars(r.browsers, 'u', function (x) { return x.k; }) + '</div>' +
    '<div class="c s8"><h2>Páginas que ven los confirmados</h2><div class="tw"><table><tr><th>Página</th><th>Personas</th><th>Cargas</th><th>Tiempo por carga</th></tr>' + r.pages.map(function (x) { return '<tr><td>' + pl(x.path) + '</td><td>' + F(x.u) + '</td><td>' + F(x.v) + '</td><td>' + (x.dur ? T(x.dur) : '—') + '</td></tr>'; }).join('') + '</table></div></div>' +
    '<div class="c s4"><h2>Acciones medidas</h2><div class="tw"><table><tr><th>Acción</th><th>Veces</th><th>Personas</th></tr>' + (r.actions.map(function (x) { return '<tr><td>' + esc(EV[x.name] || x.name) + '</td><td>' + F(x.n) + '</td><td>' + F(x.u) + '</td></tr>'; }).join('') || '<tr><td colspan="3" class="m">Sin acciones</td></tr>') + '</table></div></div>' +
    '<div class="c s12"><h2>Los visitantes confirmados, uno por uno<small>los 60 más recientes del período · cada uno muestra por qué cuenta</small></h2><div class="tw"><table><tr><th>Última vez</th><th>Quién</th><th>Equipo</th><th>Llegó desde</th><th>Por qué cuenta</th><th>Tiempo activo</th><th>Cargas</th><th>Páginas</th><th>Acciones</th></tr>' + (vis || '<tr><td colspan="9" class="m">Todavía no hay visitantes confirmados en este período</td></tr>') + '</table></div></div></div>';
}

/* ---------- pantalla ---------- */
function shell() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="top"><div><h1>Estadísticas de Twerkhub</h1></div><div class="sel" id="sel">' +
    [[1, '24 h'], [7, '7 días'], [30, '30 días'], [90, '90 días']].map(function (p) { return '<button type="button" class="btn' + (p[0] === days ? ' on' : '') + '" data-d="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
    '<button type="button" class="btn" id="refresh">Actualizar histórico ahora</button><button type="button" class="btn" id="snd"></button><a class="btn" href="/admin-users.html">Todos los usuarios</a></div></div>' +
    '<div class="status" id="status"></div><div id="def"></div><div id="live"><div class="gate">Consultando…</div></div><div id="rep"></div>';
  document.getElementById('sel').onclick = function (e) { var b = e.target.closest('[data-d]'); if (!b) return; days = +b.dataset.d; document.querySelectorAll('#sel [data-d]').forEach(function (x) { x.classList.toggle('on', x === b); }); loadReport(); };
  document.getElementById('refresh').onclick = function () { loadReport(); };
  var snd = document.getElementById('snd');
  function paint() { snd.textContent = soundOn ? '🔔 Sonido: activado' : '🔕 Activar sonido'; snd.classList.toggle('on', soundOn); }
  snd.onclick = function () { soundOn = !soundOn; try { localStorage.setItem('twk-visitor-sound', soundOn ? '1' : '0'); } catch (e) {} if (soundOn) { armAudio(); setTimeout(bubble, 150); } paint(); };
  paint(); armAudio();
}
function paintStatus() {
  var el = document.getElementById('status'); if (!el) return;
  var ls = liveOkAt ? Math.round((Date.now() - liveOkAt) / 1000) : null, stale = ls == null || ls > 20;
  el.innerHTML = '<span>' + (stale ? '<i class="dot bad"></i><b class="bad">Sin conexión con el servidor' + (ls != null ? ' hace ' + ls + ' s' : '') + '</b>' : '<i class="dot"></i><b class="ok">En vivo</b> · actualizado hace ' + ls + ' s (cada 5 s)') + '</span>' +
    '<span>Histórico: ' + (repOkAt ? 'actualizado hace ' + ago(repOkAt) + ' (cada 1 h)' : 'consultando…') + (repFail ? ' · <b class="bad">el último intento falló, reintenta solo</b>' : '') + '</span>';
}
function wireReport() {
  var mt = document.getElementById('mt'); if (mt) mt.value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  var ma = document.getElementById('ma');
  if (ma) ma.onclick = function () { var l = document.getElementById('ml').value.trim(); if (!l) return; fetch('/api/analytics/marks', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: l, channel: document.getElementById('mc').value, ts: new Date(document.getElementById('mt').value).getTime() }) }).then(loadReport); };
  document.querySelectorAll('[data-del]').forEach(function (u) { u.onclick = function () { fetch('/api/analytics/marks?id=' + u.dataset.del, { method: 'DELETE', credentials: 'same-origin' }).then(loadReport); }; });
}
function keepForm(fn) { var e = document.activeElement, st = e && e.id && /^(ml|mc|mt)$/.test(e.id) ? { id: e.id, v: e.value } : null; fn(); if (st) { var n = document.getElementById(st.id); if (n) { n.value = st.v; n.focus(); } } }

function loadLive() {
  if (liveBusy || denied || document.hidden) return; liveBusy = true;
  api('/api/stats/live?tz=' + TZ).then(function (d) { live = d; liveOkAt = Date.now(); liveFail = 0; checkSound(d); document.getElementById('def').innerHTML = defBox(); document.getElementById('live').innerHTML = liveHtml(d); })
    .catch(function (e) { liveFail++; if (denied) document.getElementById('app').innerHTML = '<div class="gate">Esta página es solo para el dueño. Iniciá sesión con tu cuenta de dueño.</div>'; })
    .finally(function () { liveBusy = false; paintStatus(); });
}
function loadReport() {
  if (repBusy || denied) return; repBusy = true; document.getElementById('refresh').textContent = 'Actualizando…';
  api('/api/stats/report?days=' + days + '&tz=' + TZ).then(function (r) { rep = r; repOkAt = Date.now(); repFail = 0; keepForm(function () { document.getElementById('rep').innerHTML = repHtml(r); wireReport(); }); })
    .catch(function () { repFail++; })
    .finally(function () { repBusy = false; var b = document.getElementById('refresh'); if (b) b.textContent = 'Actualizar histórico ahora'; paintStatus(); });
}

shell(); loadLive(); loadReport();
setInterval(loadLive, LIVE_MS);
setInterval(loadReport, REPORT_MS);
setInterval(paintStatus, 1000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) { loadLive(); if (repOkAt && Date.now() - repOkAt > REPORT_MS) loadReport(); } });
})();
