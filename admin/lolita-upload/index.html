<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Subir videos de Lolita · Twerkhub</title><style>body{margin:0;padding:32px 20px;background:#09090e;color:#eee;font:16px/1.6 system-ui}main{max-width:840px;margin:auto}h1{color:#ff9500}button{padding:12px 20px;margin:12px 8px 12px 0;border:0;border-radius:6px;background:#ff9500;color:#000;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{display:block;max-width:100%;margin:20px 0}progress{width:100%;height:26px}pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#13131b;padding:16px;border-radius:8px}a{color:#ff9500}.card{padding:20px;border:1px solid #333;border-radius:12px}</style></head><body><main><h1>Subir videos de Lolita</h1><p>Solo para el dueño. Los videos se guardan en el almacenamiento privado y la carga puede reanudarse seleccionando los mismos archivos.</p><div class="card"><p id="owner">Comprobando tu sesión…</p><input id="files" type="file" multiple accept=".mp4" disabled><button id="start" disabled>Subir seleccionados</button><button id="pause" disabled>Pausar</button><p id="summary" role="status"></p><progress id="progress" value="0" max="100"></progress><pre id="log" aria-live="polite"></pre></div><p><a href="/account">Mi cuenta</a> · <a href="/lolita/">Catálogo de Lolita</a></p></main><script>
(function(){'use strict';var files=document.getElementById('files'),start=document.getElementById('start'),pause=document.getElementById('pause'),summary=document.getElementById('summary'),bar=document.getElementById('progress'),log=document.getElementById('log'),stopped=false,running=false;
function note(t){log.textContent+=t+'\n';log.scrollTop=log.scrollHeight}
function token(){try{return JSON.parse(localStorage.getItem('alexia-auth-v3')||'{}').token||''}catch(e){return ''}}
async function api(action,name,method,body,part){var h={},t=token();if(t)h.Authorization='Bearer '+t;if(body&&!(body instanceof Blob)){h['Content-Type']='application/json';body=JSON.stringify(body)}var r=await fetch('/api/admin/media-upload?action='+action+(name?'&name='+encodeURIComponent(name):'')+(part?'&part='+part:''),{method:method||'GET',credentials:'include',headers:h,body:body});var d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function retry(fn){var last;for(var i=0;i<4;i++){try{return await fn()}catch(e){last=e;if(/owner_only|login_required|object_already_exists|different_file/.test(e.message))throw e;if(i<3)await new Promise(r=>setTimeout(r,1500*(i+1)))}}throw last}
files.onchange=function(){start.disabled=!files.files.length;summary.textContent=files.files.length+' archivos seleccionados'};
pause.onclick=function(){stopped=true;pause.disabled=true;summary.textContent='Pausando al terminar el bloque actual…'};
start.onclick=async function(){if(running)return;running=true;stopped=false;start.disabled=true;files.disabled=true;pause.disabled=false;var list=Array.from(files.files).sort((a,b)=>{var priority=n=>/^v(46|52|53|54|59|60|79|8[1-7])\.mp4$/.test(n)?0:1;return priority(a.name)-priority(b.name)||a.name.localeCompare(b.name)}),total=list.reduce((s,f)=>s+f.size,0),done=0,count=0;
try{for(var file of list){if(stopped)break;if(!/^v\d\d\.mp4$/.test(file.name))throw Error('Seleccioná los archivos preparados v01.mp4, v02.mp4, etc.');note('Preparando '+file.name);var init=await retry(()=>api('init',file.name,'POST',{size:file.size}));if(init.complete){done+=file.size;count++;note(file.name+' ya estaba completo');continue}var saved=new Set((init.parts||[]).map(p=>p.n));for(var n=1;n<=Math.ceil(file.size/init.chunk);n++){if(stopped)break;var begin=(n-1)*init.chunk,end=Math.min(begin+init.chunk,file.size);if(!saved.has(n)){summary.textContent=file.name+' · bloque '+n+' de '+Math.ceil(file.size/init.chunk)+' · '+count+' de '+list.length+' videos';await retry(()=>api('part',file.name,'PUT',file.slice(begin,end),n))}bar.value=Math.min(100,(done+end)/total*100)}if(stopped)break;var completed=await retry(()=>api('complete',file.name,'POST',{}));if(!completed.complete||completed.bytes!==file.size)throw Error('No coincide el tamaño de '+file.name);done+=file.size;count++;bar.value=done/total*100;note('VERIFICADO '+file.name+' · '+file.size+' bytes')}summary.textContent=stopped?'Carga pausada. Podés reanudar con los mismos archivos.':'COMPLETO: '+count+' videos verificados · '+done+' bytes';if(!stopped)bar.value=100}catch(e){summary.textContent='Se detuvo: '+e.message+'. Podés reanudar sin repetir lo ya subido.';note('ERROR '+e.message)}finally{running=false;start.disabled=false;files.disabled=false;pause.disabled=true}};
api('status').then(function(d){document.getElementById('owner').textContent='Sesión del dueño verificada. Elegí los archivos de la carpeta lolita-upload.';files.disabled=false;var ready=d.files.filter(f=>f.status==='complete');note(ready.length+' videos ya verificados en el almacenamiento privado')}).catch(function(e){document.getElementById('owner').textContent='Necesitás tu sesión oficial de Twerkhub: '+e.message});
})();</script></body></html>
