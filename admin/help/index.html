<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ayuda · chats</title>
<link rel="stylesheet" href="/assets/twk-ui.css?v=1">
<style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0b0a07;color:#f3efe2;font:15px Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #2a2410;background:linear-gradient(180deg,#1a1508,#0b0a07)}header h1{margin:0;font:400 26px Anton,Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#ffd76a}header small{color:#a99b72}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}@media(max-width:760px){.wrap{grid-template-columns:1fr}.wrap.in .list{display:none}.wrap:not(.in) .pane{display:none}}
.list{overflow:auto;border-right:1px solid #2a2410}.it{display:block;width:100%;text-align:left;padding:14px 18px;border:0;border-bottom:1px solid #1d1909;background:transparent;color:inherit;cursor:pointer;font:inherit}.it:hover,.it.on{background:#1a1508}
.it b{display:flex;align-items:center;gap:8px;font-size:14px}.it span{display:block;margin-top:3px;color:#a99b72;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it em{font-style:normal;color:#6f6548;font-size:12px}
.tag{padding:2px 8px;border-radius:999px;font:800 10px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.tag.waiting{background:#ff4d4d;color:#fff}.tag.open{background:#2fdc72;color:#062a14}.tag.closed{background:#2a2a2a;color:#999}.n{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:#ffd76a;color:#1a1200;font:800 12px/20px system-ui;text-align:center}
.pane{display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #2a2410}.top div{flex:1;min-width:0}.top b{display:block}.top span{color:#a99b72;font-size:13px}.back{display:none}@media(max-width:760px){.back{display:inline-flex}}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.m{max-width:75%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.m small{display:block;margin-bottom:2px;font:800 10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.m.user{align-self:flex-start;background:#1c1810;border-bottom-left-radius:4px}.m.agent{align-self:flex-end;background:linear-gradient(180deg,#ffe08a,#c99a2e);color:#1a1200;border-bottom-right-radius:4px}.m.bot{align-self:center;background:transparent;border:1px dashed #3a3115;color:#a99b72;font-size:13px;max-width:90%}
form{display:flex;gap:10px;padding:12px 18px;border-top:1px solid #2a2410}form textarea{flex:1;min-height:56px;max-height:140px;padding:14px 16px;border-radius:12px;border:2px solid #3a3a44;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif;resize:vertical}form textarea:focus{outline:0;border-color:#c99a2e}
.qr{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px 0;border-top:1px solid #2a2410}.qr button{height:36px;padding:0 12px;border-radius:10px;border:1px solid #3a3115;background:#0d0b05;color:#f1dfa6;font:700 12px system-ui;cursor:pointer}.qr button:hover{border-color:#e8b84a}.tr{margin-left:8px;font:700 10px ui-monospace,monospace;letter-spacing:.1em;color:#ffd76a;text-decoration:none;border:1px solid #3a3115;border-radius:6px;padding:1px 6px}.empty{margin:auto;color:#6f6548;text-align:center;padding:30px}.err{margin:auto;max-width:420px;text-align:center;color:#ffb3b3;padding:30px}</style></head><body>
<header><h1>Ayuda · chats</h1><small id="cnt">Cargando…</small><span style="flex:1"></span><button class="twk-btn twk-btn--ghost twk-btn--sm" id="snd" type="button">Sonido: sí</button></header>
<div class="wrap" id="wrap"><div class="list" id="list"></div><div class="pane"><div class="empty" id="empty">Elegí un chat de la lista.</div></div></div>
<script>
var A='/api/help/admin',cur=null,lastId=0,sound=true,prevWaiting=-1,es=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var QR={en:[['Saludo','Hi! Thanks for contacting Twerkhub support. How can I help you?'],['Como pagar','To pay, please open https://twerkhub.lat/paymentmethods/ and choose PayPal, Binance or card. After paying, send the receipt and the email you use at Twerkhub to twerkhub.lat@gmail.com or on our Discord.'],['Pedir comprobante','Could you send me the payment receipt and the email you use at Twerkhub? You can send it here, by email to twerkhub.lat@gmail.com or on Discord.'],['Verificando','Thanks! I am checking your payment now. It will only take a few minutes.'],['Activado','Done! Your access has been activated. Please refresh the page (Ctrl+Shift+R) and let me know if you need anything else.'],['Cierre','Glad I could help! Have a great day.']],
pt:[['Saludo','Oi! Obrigado por falar com o suporte da Twerkhub. Como posso ajudar?'],['Como pagar','Para pagar, abra https://twerkhub.lat/paymentmethods/ e escolha PayPal, Binance ou cart\u00e3o. Depois de pagar, envie o comprovante e o e-mail que voc\u00ea usa na Twerkhub para twerkhub.lat@gmail.com ou no nosso Discord.'],['Pedir comprobante','Pode me enviar o comprovante de pagamento e o e-mail que voc\u00ea usa na Twerkhub? Pode mandar aqui, por e-mail para twerkhub.lat@gmail.com ou no Discord.'],['Verificando','Obrigado! Estou conferindo seu pagamento agora. Leva s\u00f3 alguns minutos.'],['Activado','Pronto! Seu acesso foi ativado. Atualize a p\u00e1gina (Ctrl+Shift+R) e me avise se precisar de mais alguma coisa.'],['Cierre','Fico feliz em ajudar! Tenha um \u00f3timo dia.']],
es:[['Saludo','\u00a1Hola! Gracias por escribir al soporte de Twerkhub. \u00bfEn qu\u00e9 te puedo ayudar?'],['Como pagar','Para pagar, abr\u00ed https://twerkhub.lat/paymentmethods/ y eleg\u00ed PayPal, Binance o tarjeta. Despu\u00e9s de pagar, mand\u00e1 el comprobante y el email que us\u00e1s en Twerkhub a twerkhub.lat@gmail.com o por nuestro Discord.'],['Pedir comprobante','\u00bfMe pod\u00e9s mandar el comprobante de pago y el email que us\u00e1s en Twerkhub? Pod\u00e9s enviarlo ac\u00e1, por email a twerkhub.lat@gmail.com o por Discord.'],['Verificando','\u00a1Gracias! Estoy verificando tu pago ahora. Tarda solo unos minutos.'],['Activado','\u00a1Listo! Tu acceso ya est\u00e1 activado. Actualiz\u00e1 la p\u00e1gina (Ctrl+Shift+R) y avisame si necesit\u00e1s algo m\u00e1s.'],['Cierre','\u00a1Me alegra haber ayudado! Que tengas un gran d\u00eda.']]},curLang='en';
function tl(t,to,from){return 'https://translate.google.com/?sl='+(from||'auto')+'&tl='+to+'&op=translate&text='+encodeURIComponent(t)}
function beep(){if(!sound)return;try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}
function ago(t,n){var d=n-t;return d<60?'ahora':d<3600?Math.floor(d/60)+' min':d<86400?Math.floor(d/3600)+' h':Math.floor(d/86400)+' d'}
document.getElementById('snd').onclick=function(){sound=!sound;this.textContent='Sonido: '+(sound?'sí':'no')};
function api(m,b,q){return fetch(A+(q||''),{method:m,credentials:'same-origin',headers:b?{'content-type':'application/json'}:void 0,body:b?JSON.stringify(b):void 0,cache:'no-store'}).then(function(r){return r.json().then(function(j){j._s=r.status;return j})})}
function loadList(){api('GET').then(function(j){var L=document.getElementById('list');if(j._s===403){document.getElementById('wrap').innerHTML='<div class="err">Entrá con tu cuenta de dueño (alexiatwerkoficial) y recargá esta página.<br><br><a class="twk-btn" href="/account">Ir a mi cuenta</a></div>';return}
if(!j.ok)return;document.getElementById('cnt').textContent=j.waiting+' esperando';document.title=(j.waiting?'('+j.waiting+') ':'')+'Ayuda · chats';if(prevWaiting>=0&&j.waiting>prevWaiting)beep();prevWaiting=j.waiting;
L.innerHTML=j.chats.length?j.chats.map(function(c){return '<button class="it'+(c.id===cur?' on':'')+'" data-id="'+c.id+'"><b><span class="tag '+c.status+'">'+(c.status==='waiting'?'esperando':c.status==='open'?'abierto':'cerrado')+'</span>'+(c.unread_admin?'<i class="n">'+c.unread_admin+'</i>':'')+'<em style="margin-left:auto">'+ago(c.updated,j.now)+'</em></b><span>'+es(c.last||'')+'</span><em>'+es(c.email||'sin email')+' · '+es(c.path||'')+'</em></button>'}).join(''):'<div class="empty">Sin chats por ahora.</div>';
[].forEach.call(L.querySelectorAll('.it'),function(b){b.onclick=function(){open(b.dataset.id)}})})}
function open(id){cur=id;lastId=0;document.getElementById('wrap').classList.add('in');var P=document.querySelector('.pane');P.innerHTML='<div class="top"><button class="twk-btn twk-btn--ghost twk-btn--sm back" type="button" id="bk">&larr;</button><div><b id="who">…</b><span id="meta"></span></div><button class="twk-btn twk-btn--ghost twk-btn--sm" id="cl" type="button">Cerrar chat</button></div><div class="msgs" id="msgs"></div><div class="qr" id="qr"></div><form id="f"><textarea id="t" placeholder="Escribí tu respuesta… (Enter envía, Shift+Enter salto de línea)" maxlength="1500"></textarea><div style="display:flex;flex-direction:column;gap:8px"><button class="twk-btn" type="submit">Enviar</button><button class="twk-btn twk-btn--ghost twk-btn--sm" type="button" id="trb">Traducir</button></div></form>';
document.getElementById('bk').onclick=function(){document.getElementById('wrap').classList.remove('in');cur=null};
document.getElementById('cl').onclick=function(){if(confirm('¿Cerrar este chat?'))api('POST',{chat:cur,close:true}).then(function(){loadList();poll()})};
document.getElementById('trb').onclick=function(){var v=document.getElementById('t').value.trim();if(v)window.open(tl(v,curLang==='pt'?'pt':'en','es'),'_blank')};var t=document.getElementById('t');t.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit()}};
document.getElementById('f').onsubmit=function(e){e.preventDefault();var v=t.value.trim();if(!v)return;t.value='';api('POST',{chat:cur,text:v}).then(function(){poll();loadList()})};poll(true)}
function fillQr(){var q=document.getElementById('qr');if(!q)return;var L=QR[curLang]||QR.en;q.innerHTML=L.map(function(x,i){return '<button type="button" data-i="'+i+'">'+x[0]+'</button>'}).join('');[].forEach.call(q.querySelectorAll('button'),function(b){b.onclick=function(){var t=document.getElementById('t');t.value=L[b.dataset.i][1];t.focus()}})}
function poll(first){if(!cur)return;api('GET',null,'?chat='+cur+'&since='+lastId).then(function(j){if(!j.ok||j.chat==null)return;var M=document.getElementById('msgs');if(!M)return;if(first){curLang=/^(es|pt)/i.test(j.chat.lang||'')?(j.chat.lang||'en').slice(0,2).toLowerCase():'en';fillQr();document.getElementById('who').textContent=j.chat.email||'Visitante';document.getElementById('meta').textContent=(j.chat.path||'')+' · '+(j.chat.lang||'')+' · '+(j.chat.status==='waiting'?'esperando respuesta':j.chat.status)}
var stick=M.scrollTop+M.clientHeight>=M.scrollHeight-60;j.msgs.forEach(function(m){lastId=Math.max(lastId,m.id);var d=document.createElement('div');d.className='m '+m.role;d.innerHTML='<small>'+(m.role==='user'?'Visitante':m.role==='agent'?'Vos':'Bot')+'</small>'+es(m.text)+(m.role==='user'?'<a class="tr" target="_blank" rel="noopener" href="'+tl(m.text,'es')+'">ES</a>':'');M.appendChild(d)});if(stick||first)M.scrollTop=M.scrollHeight})}
loadList();setInterval(function(){loadList();poll()},4000);
</script></body></html>
