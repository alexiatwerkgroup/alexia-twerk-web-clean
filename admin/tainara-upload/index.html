<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subir videos de Tainara · Twerkhub</title><style>body{margin:0;padding:32px 20px;background:#09090e;color:#eee;font:16px/1.6 system-ui}main{max-width:840px;margin:auto}h1{color:#ff9500}button{padding:12px 20px;margin:12px 8px 12px 0;border:0;border-radius:6px;background:#ff9500;color:#000;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input{display:block;max-width:100%;margin:20px 0}progress{width:100%;height:26px}pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#13131b;padding:16px;border-radius:8px}a{color:#ff9500}.card{padding:20px;border:1px solid #333;border-radius:12px}</style><main><h1>Subir videos de Tainara</h1><p>Solo para el dueño. Los archivos se guardan en <b>tainara/</b>.</p><div class=card><p id=owner>Comprobando tu sesión…</p><input id=files type=file multiple accept=.mp4 disabled><button id=start disabled>Subir seleccionados</button><button id=pause disabled>Pausar</button><p id=summary role=status></p><progress id=progress value=0 max=100></progress><pre id=log></pre></div><p><a href=/account>Mi cuenta</a> · <a href=/tainara/>Catálogo de Tainara</a></p><script>
(async()=>{const $=id=>document.getElementById(id),files=$('files'),start=$('start'),pause=$('pause'),summary=$('summary'),bar=$('progress'),log=$('log');let stopped=false,running=false;const token=()=>{try{return JSON.parse(localStorage.getItem('alexia-auth-v3')||'{}').token||''}catch(e){return ''}};const api=async(a,n,m,b,p)=>{let h={},t=token();if(t)h.Authorization='Bearer '+t;if(b&&!(b instanceof Blob)){h['Content-Type']='application/json';b=JSON.stringify(b)}let r=await fetch('/api/admin/media-upload?model=tainara&action='+a+(n?'&name='+encodeURIComponent(n):'')+(p?'&part='+p:''),{method:m||'GET',credentials:'include',headers:h,body:b}),d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d};const retry=async fn=>{let e;for(let i=0;i<4;i++)try{return await fn()}catch(x){e=x;if(/owner_only|login_required|object_already_exists|different_file/.test(x.message))throw x;await new Promise(r=>setTimeout(r,1200*(i+1)))}throw e};const note=t=>{log.textContent+=t+'\n';log.scrollTop=log.scrollHeight};files.onchange=()=>{start.disabled=!files.files.length;summary.textContent=files.files.length+' archivos seleccionados'};pause.onclick=()=>{stopped=true;pause.disabled=true;summary.textContent='Pausando…'};start.onclick=async()=>{if(running)return;running=true;stopped=false;start.disabled=true;files.disabled=true;pause.disabled=false;let list=[...files.files].sort((a,b)=>a.name.localeCompare(b.name)),total=list.reduce((s,f)=>s+f.size,0),done=0,count=0;try{for(const file of list){if(stopped)break;if(!/^v\d\d\.mp4$/.test(file.name))throw Error('Usá nombres v01.mp4, v02.mp4, etc.');note('Preparando '+file.name);let init=await retry(()=>api('init',file.name,'POST',{size:file.size}));if(init.complete){done+=file.size;count++;note(file.name+' ya estaba completo');continue}let saved=new Set((init.parts||[]).map(p=>p.n));for(let n=1;n<=Math.ceil(file.size/init.chunk);n++){if(stopped)break;let begin=(n-1)*init.chunk,end=Math.min(begin+init.chunk,file.size);summary.textContent=file.name+' · bloque '+n+' · '+count+' de '+list.length;if(!saved.has(n))await retry(()=>api('part',file.name,'PUT',file.slice(begin,end),n));bar.value=Math.min(100,(done+end)/total*100)}if(stopped)break;let c=await retry(()=>api('complete',file.name,'POST',{}));if(!c.complete)throw Error('No se pudo verificar '+file.name);done+=file.size;count++;note('VERIFICADO '+file.name+' · '+file.size+' bytes')}summary.textContent=stopped?'Carga pausada.':'COMPLETO: '+count+' videos verificados';if(!stopped)bar.value=100}catch(e){summary.textContent='Se detuvo: '+e.message;note('ERROR '+e.message)}finally{running=false;start.disabled=false;files.disabled=false;pause.disabled=true}};api('status').then(d=>{$('owner').textContent='Sesión del dueño verificada. Elegí los previews de Tainara.';files.disabled=false;note(d.files.filter(f=>f.status==='complete').length+' videos Tainara ya verificados')}).catch(e=>{$('owner').textContent='Necesitás tu sesión oficial: '+e.message})})();</script>
